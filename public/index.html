<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RevzzKey — Digital Store</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eef1f6;font:15px system-ui,Arial}header{position:sticky;top:0;background:#0b0d12ee;border-bottom:1px solid #252a35;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;z-index:2}.brand{font-size:22px;font-weight:850;letter-spacing:-.6px}.brand span{color:#67e0a3}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.hero{border:1px solid #252a35;background:linear-gradient(135deg,#171b25,#10131a);padding:28px;border-radius:20px;margin-bottom:24px}.hero h1{font-size:clamp(26px,5vw,42px);margin:0 0 10px}.hero p{color:#aeb7c6}.search{width:100%;background:#141821;border:1px solid #303747;color:white;padding:12px;border-radius:10px;margin:8px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #262d39;background:#121620;border-radius:15px;padding:17px}.card h3{margin:0 0 8px}.muted{color:#aab3c2;font-size:13px}.price{font-size:20px;font-weight:800;margin:14px 0}.btn{background:#67e0a3;color:#07130d;font-weight:750;border:0;padding:11px 14px;border-radius:10px;cursor:pointer}.btn.secondary{background:#252c39;color:#f2f5fa}.btn:disabled{opacity:.4}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;overflow:auto;padding:20px}.box{max-width:500px;margin:5vh auto;background:#131823;border:1px solid #343c4b;border-radius:18px;padding:20px}.box input,.box textarea{width:100%;padding:11px;margin:8px 0;border-radius:9px;background:#0b0e14;border:1px solid #313a49;color:white}.qris{width:230px;max-width:100%;background:white;padding:10px;border-radius:10px;display:block;margin:15px auto}.footer{padding:25px;text-align:center;color:#8590a3}.pill{display:inline-block;padding:5px 9px;background:#202938;border-radius:20px;font-size:12px;color:#a9e7c9}a{color:#67e0a3}pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><header><div class="brand">Revzz<span>Key</span></div><button class="btn secondary" onclick="showOrderLookup()">Cek Pesanan</button></header><main class="wrap"><section class="hero"><span class="pill">DIGITAL DELIVERY</span><h1>Digital keys, <span style="color:#67e0a3">simple & fast.</span></h1><p>Pilih produk, buat pesanan, lalu ikuti instruksi pembayaran.</p><div class="row"><button class="btn" onclick="loadProducts()">Refresh katalog</button><button class="btn secondary" onclick="adminOpen()">Admin</button></div></section><input id="search" class="search" placeholder="Cari produk..." oninput="render()"><div id="catalog" class="grid"><div class="card muted">Memuat katalog…</div></div></main><div class="footer">RevzzKey · Digital storefront</div>
<div class="modal" id="modal"><div class="box"><button class="btn secondary" style="float:right" onclick="closeModal()">Tutup</button><div id="modalContent"></div></div></div>
<script>
let items=[],selected=null;const $=id=>document.getElementById(id);async function loadProducts(){ $('catalog').innerHTML='<div class="card muted">Memuat…</div>';try{let r=await fetch('/api/catalog'),j=await r.json();if(!r.ok)throw Error(j.error);items=j.items||[];render()}catch(e){$('catalog').innerHTML='<div class="card">Katalog belum dapat dimuat. Pastikan server dan DRIP_API_KEY sudah dikonfigurasi. <p class="muted">'+e.message+'</p></div>'}}
function render(){let q=$('search').value.toLowerCase();let filtered=items.filter(x=>(x.name||x.product||'').toLowerCase().includes(q)||(x.category||'').toLowerCase().includes(q));$('catalog').innerHTML=filtered.length?filtered.map((x,i)=>`<div class="card"><span class="pill">${esc(x.category||'Digital')}</span><h3>${esc(x.name||x.product||x.apiCode)}</h3><div class="muted">${esc(x.label||'')}</div><div class="price">$${esc(x.priceUsd||'—')}</div><div class="muted">Stok: ${x.stock??'—'} ${x.is_maintenance?'· Maintenance':''}</div><button class="btn" style="margin-top:12px" ${!x.inStock||x.is_maintenance?'disabled':''} onclick="buy(${items.indexOf(x)})">Beli</button></div>`).join(''):'<div class="card">Produk tidak ditemukan.</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openModal(html){$('modalContent').innerHTML=html;$('modal').style.display='block'}function closeModal(){$('modal').style.display='none'}
async function buy(i){selected=items[i];openModal(`<h2>Checkout</h2><p>${esc(selected.name)}</p><p>Harga supplier ditampilkan sebagai perkiraan; jumlah akhir dikonfirmasi server.</p><label>Jumlah</label><input id="qty" type="number" value="1" min="1" max="10"><label>Nama pembeli</label><input id="buyer" placeholder="Nama / username"><label>Email (opsional)</label><input id="email" type="email" placeholder="Email untuk referensi"><button class="btn" onclick="createOrder()">Buat pesanan</button>`)}
async function createOrder(){try{let r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:selected.apiCode,quantity:Number($('qty').value),buyer:$('buyer').value,email:$('email').value})});let j=await r.json();if(!r.ok)throw Error(j.error);let o=j.order;openModal(`<h2>Pesanan ${esc(o.id)}</h2><p>Produk: ${esc(o.name)} × ${o.quantity}</p><p>Harga total supplier: <b>$${esc(o.totalUsd)}</b></p><p class="muted">Jumlah IDR final belum ditentukan; silakan konfigurasikan harga/konversi sebelum penggunaan publik.</p><img class="qris" src="${esc(j.qris)}" alt="QRIS" onerror="this.style.display='none'"><p class="muted">Scan QRIS, lalu konfirmasi pembayaran di bawah. Pesanan akan diverifikasi admin sebelum key diproses.</p><textarea id="paynote" placeholder="Catatan/bukti pembayaran (link atau keterangan)"></textarea><button class="btn" onclick="reportPaid('${esc(o.id)}')">Saya sudah bayar</button><p class="muted">Simpan ID pesanan ini untuk mengecek status.</p>`)}catch(e){alert(e.message)}}
async function reportPaid(id){try{let r=await fetch('/api/order/'+id+'/paid-note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:$('paynote').value})});let j=await r.json();if(!r.ok)throw Error(j.error);openModal(`<h2>Konfirmasi dikirim</h2><p>Order <b>${esc(id)}</b> menunggu verifikasi admin. Simpan ID pesanan untuk mengecek status.</p>`)}catch(e){alert(e.message)}}
function showOrderLookup(){openModal(`<h2>Cek pesanan</h2><input id="orderid" placeholder="ID pesanan"><button class="btn" onclick="lookup()">Cari</button><div id="lookupresult"></div>`)}async function lookup(){try{let r=await fetch('/api/order/'+encodeURIComponent($('orderid').value)),j=await r.json();if(!r.ok)throw Error(j.error);$('lookupresult').innerHTML=`<p>Status: <b>${esc(j.order.status)}</b></p><p>${esc(j.order.name)} × ${j.order.quantity}</p>${j.order.keys?'<pre>'+esc(j.order.keys.join('\n'))+'</pre>':''}`}catch(e){$('lookupresult').innerHTML='<p>'+esc(e.message)+'</p>'}}
async function adminOpen(){openModal(`<h2>Admin login</h2><input id="adminpass" type="password" placeholder="Password admin"><button class="btn" onclick="adminLogin()">Login</button>`)}let token='';async function adminLogin(){try{let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('adminpass').value})}),j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;adminPanel()}catch(e){alert(e.message)}}async function adminPanel(){try{let [or,bal]=await Promise.all([fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}}),fetch('/api/admin/balance',{headers:{Authorization:'Bearer '+token}})]);let oj=await or.json(),bj=await bal.json();openModal(`<h2>Admin · RevzzKey</h2><p>Saldo supplier: $${esc(bj.balanceUsd||'—')}</p><div>${(oj.orders||[]).map(o=>`<div class="card" style="margin:10px 0"><b>${esc(o.id)}</b><p>${esc(o.name)} × ${o.quantity}</p><p>Status: ${esc(o.status)}</p><p>Total: $${esc(o.totalUsd)}</p>${o.status==='PAYMENT_REPORTED'?`<button class="btn secondary" onclick="confirmOrder('${esc(o.id)}')">Konfirmasi pembayaran</button>`:''}${o.status==='PAYMENT_CONFIRMED'?`<button class="btn" onclick="fulfill('${esc(o.id)}')">Proses & kirim key</button>`:''}${o.keys?'<pre>'+esc(o.keys.join('\n'))+'</pre>':''}</div>`).join('')||'Belum ada pesanan.'}</div>`)}catch(e){alert(e.message)}}async function confirmOrder(id){await fetch('/api/admin/order/'+id+'/confirm',{method:'POST',headers:{Authorization:'Bearer '+token}});adminPanel()}async function fulfill(id){try{let r=await fetch('/api/admin/order/'+id+'/fulfill',{method:'POST',headers:{Authorization:'Bearer '+token}}),j=await r.json();if(!r.ok)throw Error(j.error);adminPanel()}catch(e){alert(e.message)}}loadProducts();
</script></body></html>
